name: repair tree
on:
  push:
    paths:
      - .github/workflows/repair-tree.yml
      - public/og.png.b64
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write social preview from text payload
        run: |
          python3 << 'PY'
          import base64, hashlib
          from pathlib import Path
          b64_path = Path("public/og.png.b64")
          if not b64_path.exists():
              raise SystemExit(0)
          raw = base64.b64decode(b64_path.read_text().strip())
          png_digest = hashlib.sha256(raw).hexdigest()
          png_expected = "c6b626831cff458db66d6bfe0713f10cc381448a043280b6f96910d6bb412f33"
          if png_digest != png_expected or len(raw) != 26010 or raw[:8] != bytes.fromhex("89504e470d0a1a0a"):
              raise SystemExit(f"png digest {png_digest} len {len(raw)}")
          Path("public/og.png").write_bytes(raw)
          PY
          if [ ! -f public/og.png ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og.png
          git rm -f public/og.png.b64
          git diff --cached --quiet && exit 0
          git commit -m "fix: add public/og.png social preview"
          git push origin HEAD:main
