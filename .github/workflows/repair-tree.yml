name: repair tree
on:
  push:
    paths:
      - .github/workflows/repair-tree.yml
      - public/og.part2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize og.png
        run: |
          python3 << 'PY'
          import base64, hashlib
          from pathlib import Path
          parts = [Path(f"public/og.part{i}") for i in range(3)]
          if not all(p.exists() for p in parts):
              print("parts incomplete")
              raise SystemExit(0)
          text0 = parts[0].read_text()
          if text0.count("hCfA") != 1:
              raise SystemExit("part0 marker missing")
          parts[0].write_text(text0.replace("hCfA", "hMfA", 1))
          b64 = "".join(p.read_text().strip() for p in parts)
          raw = base64.b64decode(b64)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "c6b626831cff458db66d6bfe0713f10cc381448a043280b6f96910d6bb412f33"
          if digest != expected or len(raw) != 26010:
              raise SystemExit(f"png digest {digest} len {len(raw)}")
          Path("public/og.png").write_bytes(raw)
          print("png ok")
          PY
          if [ ! -f public/og.png ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og.png
          git rm -f public/og.part0 public/og.part1 public/og.part2 public/_binprobe.bin public/_encprobe.txt .github/workflows/repair-tree.yml
          git commit -m "fix: add social preview image"
          git push origin HEAD:main
